# Speaker-specific parts of the Haiku prompt: copy this file to
# ~/.config/jargonaut/prompt.toml and adapt it to your own vocabulary.
# Every key you leave out falls back to this file. See haiku/build_prompt.py
# for where each value goes in the prompt template.

# How the prompt refers to the speaker, mid-sentence ("what the speaker dictated").
name = "the speaker"

# The sentence that introduces the speaker.
speaker = "The speaker, a French software engineer, dictates in French with many English technical terms (databases, containers, Python and Rust tooling)."

# Examples of deformed words, shown inside parentheses in the "evident errors" rule.
evident_errors = '''"relencer" for "relancer", "un serveur en prode" for "un serveur en prod", "le dépo git" for "le dépôt git"'''

# An accidental English run and its fix.
english_run = '''"j'ai redémarré le conteneur and the proxy" becomes "j'ai redémarré le conteneur et le proxy"'''

# English expressions the speaker really uses, which must stay.
english_expressions = '''"c'est du best effort", "by design"'''

# Notes on ambiguous heard forms, as a Markdown list. Leave it empty to drop the section.
ambiguous_forms = '''
- "cargo": Cargo when it is the Rust tool ("cargo build", "avec cargo"); "un cargo" (a ship) is kept.
- "vite": Vite when it is the build tool ("le serveur vite", "la config de vite"); the adverb ("fais vite") is kept.
- "trafic": Traefik when it is the proxy ("les routes de trafic", "le middleware trafic"); network traffic ("le trafic réseau") is kept.
'''

# Worked examples: <segment> and the expected <out>, optionally with <previous_segments>.
examples = '''
<segment>Lance cargo build puis les tests avec pie test.</segment>
<out>Lance cargo build puis les tests avec pytest.</out>

<segment>J'ai mis le Max Surge à deux et le Read Only Root Filesystem à true.</segment>
<out>J'ai mis le maxSurge à deux et le readOnlyRootFilesystem à true.</out>

<segment>Le trafic réseau a doublé depuis hier soir.</segment>
<out>Le trafic réseau a doublé depuis hier soir.</out>

<previous_segments>
