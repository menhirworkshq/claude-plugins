name: Conform

on:
  pull_request:
  # Direct pushes to main skip pull requests: lint them after the fact, so a bad commit is at
  # least reported.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conform:
    name: Conform
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # A review fix left as a fixup!, squash! or amend! commit would land as is: say how to fold it.
      - name: Look for unfolded review fixes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          unfolded=$(git log --format=%s "origin/$BASE_REF..HEAD" | grep -E '^(fixup|squash|amend)! ' || true)
          if [ -n "$unfolded" ]; then
            printf '%s\n' "$unfolded"
            echo "::error::Fold the review fixes before the merge: git rebase -i --autosquash origin/$BASE_REF, then git push --force-with-lease."
            exit 1
          fi

      - name: Check the commit scopes
        run: task check-scopes

      # A pull request is linted since its base branch, a push since the commit main was at before
      # it (the first commit when the push created main).
      - name: Find the first commit to lint
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="origin/$PR_BASE"
          elif [ -z "${PUSH_BEFORE//0/}" ]; then
            base=$(git rev-list --max-parents=0 HEAD)
          else
            base="$PUSH_BEFORE"
          fi
          echo "BASE_BRANCH=$base" >> "$GITHUB_ENV"

      - name: Lint commits
        run: task conform BASE_BRANCH="$BASE_BRANCH"

      - name: Check that each commit touches 1 plugin at most, named as its scope
        run: task check-commits BASE_BRANCH="$BASE_BRANCH"
